services:
  - type: web
    name: smartpos-demo
    env: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan migrate:fresh --seed --force
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: base64:HZhD1Z2XLzBOIJjzrAm3Qr76NVyvQqRwo3qj5gyhaRo=
      - key: DB_CONNECTION
        value: sqlite
